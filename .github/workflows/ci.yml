name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Install frontend dependencies
        run: npm install --prefix frontend/frontend

      - name: Run backend tests
        run: npm --prefix backend test -- --runInBand

      - name: Run frontend tests
        run: npm --prefix frontend/frontend run test

      - name: Run backend coverage
        run: npm --prefix backend run test:coverage -- --runInBand

      - name: Run frontend build
        run: npm --prefix frontend/frontend run build

      - name: Run root doctor check
        run: npm run doctor
